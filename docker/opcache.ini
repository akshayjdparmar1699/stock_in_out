; Production PHP performance tuning. Without this, PHP recompiles the
; entire Laravel framework + app code from scratch on every request,
; which is the single biggest source of slow response times.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; Code only changes on deploy (new container), never mid-flight, so
; skip the per-request "has this file changed on disk" check.
opcache.validate_timestamps=0
opcache.save_comments=1

realpath_cache_size=4096K
realpath_cache_ttl=600
